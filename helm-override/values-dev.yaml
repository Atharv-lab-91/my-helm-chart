isProd: false

namespace: dev

configmap:
  name: helmappconfigmap-dev
  data:
    CUSTOM_HEADER: "This is a Development Environment!!!"
    BG_COLOR: '#001f3f'
    FONT_COLOR: '#00FF00'

image:
  name: nginx
  tag: latest         
  pullPolicy: IfNotPresent

service1:
  name: service-one-dev
  useConfig: true

service2:
  name: service-two-dev
  useConfig: false

hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 60

ingress:
  host: dev.app.example.com
