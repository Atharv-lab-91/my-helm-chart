{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ingress
spec:
  rules:
    - host: {{ .Values.ingress.host}}
      http:
        paths:
          - path: {{ .Values.ingress.path}}
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.service1.name }}
                port:
                  number: 80
{{- end}}