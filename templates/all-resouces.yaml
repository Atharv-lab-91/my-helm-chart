{{- if .Values.service1.useConfig }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.configmap.name }}
  namespace: {{ .Values.namespace }}
data:
  BG_COLOR: {{ .Values.configmap.data.BG_COLOR | quote }}
  FONT_COLOR: {{ .Values.configmap.data.FONT_COLOR | quote }}
  CUSTOM_HEADER: {{ if .Values.isProd }}"Welcome to the production version!"{{ else }}"This is a development environment."{{ end }}
{{- end }}

---

apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.appName }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.appName }}
spec:
  ports:
    - port: 80
      protocol: TCP
      name: flask
  selector:
    app: {{ .Values.appName }}
    tier: frontend
  type: NodePort

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.service1.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.service1.name }}
spec:
  replicas: {{ .Values.isProd | ternary 5 1 }}
  selector:
    matchLabels:
      app: {{ .Values.service1.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.service1.name }}
    spec:
      containers:
        - name: "{{ .Values.service1.name }}-container"
          image: "{{ .Values.image.name }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 80
            - containerPort: 443
            - containerPort: 8080
          {{- if .Values.service1.useConfig }}
          envFrom:
            - configMapRef:
                name: {{ .Values.configmap.name }}
          {{- end }}
          resources:
            requests:
              memory: "16Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.service2.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.service2.name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.service2.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.service2.name }}
    spec:
      containers:
        - name: "{{ .Values.service2.name }}-container"
          image: "{{ .Values.image.name }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "16Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
